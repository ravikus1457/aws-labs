{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lab06-app.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lab06-app.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.roleArn }}
  annotations:
    # IRSA: the EKS pod-identity webhook reads this and mutates every pod using
    # this SA to carry AWS_ROLE_ARN, AWS_WEB_IDENTITY_TOKEN_FILE and a projected
    # token volume. The IAM role's trust policy pins <namespace>:<this name>.
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
