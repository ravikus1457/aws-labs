# Lab 06 — scheduled teardown. Runs every night so nothing is left billing,
# whatever happened during the day. Also runnable by hand.
#
# Destroys ONLY the app stack (VPC, NAT, ALB, ECS, alarms...). The bootstrap
# stack (state bucket, ECR, OIDC role, budget) is free and stays.
# A failed run shows red in Actions and GitHub emails the repo owner - that is
# the alert path; `scripts/guardrails.sh orphans` is the manual check.
name: lab06-destroy

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily (00:00 PDT / 23:00 PST)
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: lab06-destroy
  cancel-in-progress: false

env:
  LAB_DIR: labs/06-ecs-fargate-cicd
  TF_VERSION: "1.16.4"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  destroy:
    name: terraform destroy (app stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-lab06-destroy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Write backend.tf
        working-directory: ${{ env.LAB_DIR }}
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          test -n "$TF_STATE_BUCKET" || { echo "repo variable TF_STATE_BUCKET is not set"; exit 1; }
          cat > backend.tf <<EOF
          terraform {
            backend "s3" {
              bucket       = "${TF_STATE_BUCKET}"
              key          = "lab06/terraform.tfstate"
              region       = "${AWS_REGION}"
              encrypt      = true
              use_lockfile = true
            }
          }
          EOF

      - name: terraform destroy
        working-directory: ${{ env.LAB_DIR }}
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_ecr_repository_name: ${{ vars.ECR_REPOSITORY || 'awslabs-lab06/app' }}
        run: |
          terraform init
          terraform destroy -auto-approve -no-color | tee destroy.txt
          {
            echo "### terraform destroy"
            echo '```'
            grep -E '^(Destroy complete|No changes)' destroy.txt || tail -n 5 destroy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Ground truth, not Terraform's opinion: ask the tagging API whether
      # anything tagged stack=app from this lab still exists.
      - name: Verify nothing from the app stack survived
        run: |
          set -euo pipefail
          # Survivors are counted from the OWNING services, not the tagging index: on 2026-10-01 the
          # resourcegroupstaggingapi still listed 10 ARNs (deleted NAT, released EIP, deleted SG rules, deleted
          # alarms) more than 10 minutes after a clean destroy, while every describe call said 0. The tagging
          # listing is kept below for information only. Anything in the lists below is real and billable or
          # holds billable things, and all of it carries project=awslabs + lab=06-ecs-fargate-cicd tags.
          F="Name=tag:project,Values=awslabs Name=tag:lab,Values=06-ecs-fargate-cicd"
          VPCS=$(aws ec2 describe-vpcs --region "$AWS_REGION" --filters $F --query 'Vpcs[].VpcId' --output text)
          NATS=$(aws ec2 describe-nat-gateways --region "$AWS_REGION" --filter $F Name=state,Values=pending,available --query 'NatGateways[].NatGatewayId' --output text)
          EIPS=$(aws ec2 describe-addresses --region "$AWS_REGION" --filters $F --query 'Addresses[].AllocationId' --output text)
          LBS=$(aws elbv2 describe-load-balancers --region "$AWS_REGION" --query "LoadBalancers[?starts_with(LoadBalancerName, 'awslabs-lab06')].LoadBalancerArn" --output text)
          CLUSTERS=$(aws ecs list-clusters --region "$AWS_REGION" --query "clusterArns[?contains(@, 'awslabs-lab06')]" --output text)
          ALARMS=$(aws cloudwatch describe-alarms --region "$AWS_REGION" --alarm-name-prefix awslabs-lab06 --query 'MetricAlarms[].AlarmName' --output text)
          LOGS=$(aws logs describe-log-groups --region "$AWS_REGION" --log-group-name-prefix /ecs/awslabs-lab06 --query 'logGroups[].logGroupName' --output text)
          printf 'vpcs: %s\nnat gateways (pending/available): %s\neips: %s\nload balancers: %s\necs clusters: %s\nalarms: %s\nlog groups: %s\n' \
            "${VPCS:-none}" "${NATS:-none}" "${EIPS:-none}" "${LBS:-none}" "${CLUSTERS:-none}" "${ALARMS:-none}" "${LOGS:-none}"
          COUNT=0
          for v in "$VPCS" "$NATS" "$EIPS" "$LBS" "$CLUSTERS" "$ALARMS" "$LOGS"; do
            for item in $v; do COUNT=$((COUNT + 1)); done
          done
          aws resourcegroupstaggingapi get-resources --region "$AWS_REGION" \
            --tag-filters Key=project,Values=awslabs Key=lab,Values=06-ecs-fargate-cicd Key=stack,Values=app \
            --query 'ResourceTagMappingList[].ResourceARN' --output json > leftovers.json || echo '[]' > leftovers.json
          echo "tagging index still lists $(jq 'length' leftovers.json) ARN(s) (informational; the index lags deletes by 10+ min)"
          echo "resources still tagged stack=app: $COUNT"
          if [ "$COUNT" -ne 0 ]; then
            echo "::error::$COUNT lab 06 app-stack resources still exist after destroy (see above). Run: scripts/guardrails.sh orphans"
            exit 1
          fi
          echo "- leftovers: 0" >> "$GITHUB_STEP_SUMMARY"
