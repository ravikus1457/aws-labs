! core2 - campus core/distribution router B, OSPF ABR. Mirror of core1 (see core1/frr.conf for the plan):
! .3 on both user VLANs, preferred VRRP master for VLAN 20, backup for VLAN 10.
frr version 10.6
frr defaults traditional
hostname core2
log file /tmp/frr.log informational
service integrated-vtysh-config
!
ip forwarding
!
interface lo
 ip address 10.255.0.2/32
 ip ospf area 0
exit
!
interface eth1.10
 description VLAN 10 users (gateway VIP 10.10.10.1 is keepalived's)
 ip address 10.10.10.3/24
 ip ospf area 1
 ip ospf passive
 ip ospf cost 10
exit
!
interface eth1.20
 description VLAN 20 users (gateway VIP 10.10.20.1 is keepalived's)
 ip address 10.10.20.3/24
 ip ospf area 1
 ip ospf passive
 ip ospf cost 10
exit
!
interface eth2
 description dc (backbone)
 ip address 10.0.12.1/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf cost 10
exit
!
interface eth3
 description core1 (inter-core link)
 ip address 10.0.0.2/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf cost 10
exit
!
router ospf
 ospf router-id 10.255.0.2
 area 1 range 10.10.0.0/16
exit
!
line vty
!
