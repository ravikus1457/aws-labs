! dc - data-centre / WAN edge router in the OSPF backbone (area 0). Hosts the server LAN 10.100.0.0/24.
! It reaches the campus through BOTH cores: the area-1 summary 10.10.0.0/16 arrives from core1 and core2
! at equal cost, so it is installed as ECMP (two next hops) - the lab proves that in the FIB and in the
! kernel's per-flow choice (fib_multipath_hash_policy=1, L4 hash).
frr version 10.6
frr defaults traditional
hostname dc
log file /tmp/frr.log informational
service integrated-vtysh-config
!
ip forwarding
!
interface lo
 ip address 10.255.0.3/32
 ip ospf area 0
exit
!
interface eth1
 description core1
 ip address 10.0.11.2/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf cost 10
exit
!
interface eth2
 description core2
 ip address 10.0.12.2/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf cost 10
exit
!
interface eth3
 description server LAN (srv)
 ip address 10.100.0.1/24
 ip ospf area 0
 ip ospf passive
 ip ospf cost 10
exit
!
router ospf
 ospf router-id 10.255.0.3
exit
!
line vty
!
