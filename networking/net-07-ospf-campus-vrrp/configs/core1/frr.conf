! core1 - campus core/distribution router A, OSPF ABR (area 0 backbone + area 1 campus access).
!   VLAN 10 users 10.10.10.0/24 - core1 .2, core2 .3, gateway VIP .1 (VRRP group 10, core1 preferred)
!   VLAN 20 users 10.10.20.0/24 - core1 .2, core2 .3, gateway VIP .1 (VRRP group 20, core2 preferred)
! The VLAN interfaces (eth1.10 / eth1.20 on the trunk to the access switch) are created by run.sh;
! zebra applies the addresses below when they appear. They are PASSIVE: no OSPF hellos towards users.
! Area 1 is summarised to 10.10.0.0/16 at the ABR, so the backbone sees one route, not every VLAN.
! Explicit costs everywhere, so equal paths are equal by design (ECMP at dc), not by link-speed luck.
frr version 10.6
frr defaults traditional
hostname core1
log file /tmp/frr.log informational
service integrated-vtysh-config
!
ip forwarding
!
interface lo
 ip address 10.255.0.1/32
 ip ospf area 0
exit
!
interface eth1.10
 description VLAN 10 users (gateway VIP 10.10.10.1 is keepalived's)
 ip address 10.10.10.2/24
 ip ospf area 1
 ip ospf passive
 ip ospf cost 10
exit
!
interface eth1.20
 description VLAN 20 users (gateway VIP 10.10.20.1 is keepalived's)
 ip address 10.10.20.2/24
 ip ospf area 1
 ip ospf passive
 ip ospf cost 10
exit
!
interface eth2
 description dc (backbone)
 ip address 10.0.11.1/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf cost 10
exit
!
interface eth3
 description core2 (inter-core link)
 ip address 10.0.0.1/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf cost 10
exit
!
router ospf
 ospf router-id 10.255.0.1
 area 1 range 10.10.0.0/16
exit
!
line vty
!
