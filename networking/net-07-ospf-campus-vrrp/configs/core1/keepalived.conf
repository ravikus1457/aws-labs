! keepalived on core1 - VRRPv3 first-hop redundancy for the two user VLANs.
! VLAN 10: core1 priority 200 (master), core2 100. VLAN 20: core2 200 (master), core1 100.
! Both start as BACKUP; the higher priority wins the election and preempts when it comes back.
! advert_int 0.2 s (VRRPv3 allows centiseconds): a backup declares the master dead after
! 3 x 0.2 s + skew ~ 0.72 s. The uplink track script (init_fail) keeps a booting core at
! priority-150 until its OSPF route to the servers exists, so preemption cannot black-hole users.
global_defs {
    router_id core1
    vrrp_version 3
    script_user root
    vrrp_garp_master_repeat 3
    vrrp_garp_master_refresh 0
}

vrrp_script uplink {
    script "/bin/sh /etc/keepalived/chk_uplink.sh"
    interval 1
    timeout 1
    rise 1
    fall 1
    weight -150
    init_fail
}

vrrp_instance VLAN10 {
    state BACKUP
    interface eth1.10
    virtual_router_id 10
    priority 200
    advert_int 0.2
    virtual_ipaddress {
        10.10.10.1/24 dev eth1.10
    }
    track_script {
        uplink
    }
}

vrrp_instance VLAN20 {
    state BACKUP
    interface eth1.20
    virtual_router_id 20
    priority 100
    advert_int 0.2
    virtual_ipaddress {
        10.10.20.1/24 dev eth1.20
    }
    track_script {
        uplink
    }
}
