! ispb - ISP-B, AS 64502. Same role as ISP-A, different junk:
!   * 192.168.50.0/24 (RFC 1918) and 203.0.113.128/25 - a more-specific of the CUSTOMER'S OWN prefix,
!     i.e. the classic hijack/leak shape that AS-path loop detection does NOT catch (no AS 65010 in the
!     path). ent must drop it by prefix, which the lab asserts. The blackhole only covers the upper half
!     of 203.0.113.0/24, so the probe host h1 (203.0.113.10) is never affected.
! Router-id 10.255.1.1 is deliberately LOWER than ISP-A's 10.255.1.2: inet compares router-ids, so if
! ent did NOT prepend towards ISP-B, inet would pick ISP-B on the tie-break. The inbound preference for
! ISP-A that the lab measures is therefore caused by the prepend, not by an accident of ordering.
frr version 10.6
frr defaults traditional
hostname ispb
log file /tmp/frr.log informational
service integrated-vtysh-config
!
ip forwarding
!
debug bgp neighbor-events
debug bfd peer
!
interface eth1
 description customer ent
 ip address 10.0.2.1/30
exit
!
interface eth2
 description upstream inet
 ip address 10.1.2.1/30
exit
!
ip route 192.168.50.0/24 blackhole
ip route 203.0.113.128/25 blackhole
!
bfd
 profile fast
  detect-multiplier 3
  receive-interval 100
  transmit-interval 100
 exit
exit
!
ip prefix-list CUSTOMER-ENT seq 10 permit 203.0.113.0/24
!
route-map CUSTOMER-IN permit 10
 match ip address prefix-list CUSTOMER-ENT
 set local-preference 200
exit
route-map TO-CUSTOMER permit 10
exit
route-map FROM-UPSTREAM permit 10
exit
route-map TO-UPSTREAM permit 10
 match ip address prefix-list CUSTOMER-ENT
exit
!
router bgp 64502
 bgp router-id 10.255.1.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.0.2.2 remote-as 65010
 neighbor 10.0.2.2 description customer ent
 neighbor 10.0.2.2 timers 10 30
 neighbor 10.0.2.2 timers connect 5
 neighbor 10.0.2.2 advertisement-interval 0
 neighbor 10.0.2.2 bfd
 neighbor 10.0.2.2 bfd profile fast
 neighbor 10.1.2.2 remote-as 64500
 neighbor 10.1.2.2 description upstream inet
 neighbor 10.1.2.2 timers connect 5
 neighbor 10.1.2.2 advertisement-interval 0
 !
 address-family ipv4 unicast
  network 192.168.50.0/24
  network 203.0.113.128/25
  neighbor 10.0.2.2 activate
  neighbor 10.0.2.2 default-originate
  neighbor 10.0.2.2 route-map CUSTOMER-IN in
  neighbor 10.0.2.2 route-map TO-CUSTOMER out
  neighbor 10.1.2.2 activate
  neighbor 10.1.2.2 route-map FROM-UPSTREAM in
  neighbor 10.1.2.2 route-map TO-UPSTREAM out
 exit-address-family
exit
!
line vty
!
