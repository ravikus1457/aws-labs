! inet - "the Internet", AS 64500. Transit for both ISPs; hosts the probe target srv (198.51.100.10)
! and originates a second remote block (192.0.2.0/24) so the ISPs announce more than one prefix.
! `bgp bestpath compare-routerid` makes the tie-break deterministic (lowest neighbor router-id wins,
! i.e. ISP-B); ent's AS-path prepend towards ISP-B is what has to override it.
frr version 10.6
frr defaults traditional
hostname inet
log file /tmp/frr.log informational
service integrated-vtysh-config
!
ip forwarding
!
interface eth1
 description ISP-A
 ip address 10.1.1.2/30
exit
!
interface eth2
 description ISP-B
 ip address 10.1.2.2/30
exit
!
interface eth3
 description server LAN (srv)
 ip address 198.51.100.1/24
exit
!
ip route 192.0.2.0/24 blackhole
!
route-map ALL permit 10
exit
!
router bgp 64500
 bgp router-id 10.255.9.9
 bgp log-neighbor-changes
 bgp bestpath compare-routerid
 no bgp default ipv4-unicast
 neighbor 10.1.1.1 remote-as 64501
 neighbor 10.1.1.1 description ISP-A
 neighbor 10.1.1.1 timers connect 5
 neighbor 10.1.1.1 advertisement-interval 0
 neighbor 10.1.2.1 remote-as 64502
 neighbor 10.1.2.1 description ISP-B
 neighbor 10.1.2.1 timers connect 5
 neighbor 10.1.2.1 advertisement-interval 0
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  network 192.0.2.0/24
  neighbor 10.1.1.1 activate
  neighbor 10.1.1.1 route-map ALL in
  neighbor 10.1.1.1 route-map ALL out
  neighbor 10.1.2.1 activate
  neighbor 10.1.2.1 route-map ALL in
  neighbor 10.1.2.1 route-map ALL out
 exit-address-family
exit
!
line vty
!
