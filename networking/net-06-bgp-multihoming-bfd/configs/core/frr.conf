! core - enterprise internal router, AS 65010. Owns the user LAN 203.0.113.0/24 (host h1 = .10).
! OSPF area 0 with ent carries loopbacks only; iBGP with ent (loopback to loopback) originates our
! prefix and learns the Internet routes (next hop = ent's loopback, resolved through OSPF).
frr version 10.6
frr defaults traditional
hostname core
log file /tmp/frr.log informational
service integrated-vtysh-config
!
ip forwarding
!
interface lo
 ip address 10.255.0.2/32
exit
!
interface eth1
 description ent (edge)
 ip address 10.0.0.2/30
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
interface eth2
 description user LAN (h1)
 ip address 203.0.113.1/24
exit
!
router ospf
 ospf router-id 10.255.0.2
 network 10.0.0.0/30 area 0
 network 10.255.0.2/32 area 0
exit
!
router bgp 65010
 bgp router-id 10.255.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.255.0.1 remote-as 65010
 neighbor 10.255.0.1 description ent (iBGP)
 neighbor 10.255.0.1 update-source lo
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 10.255.0.1 activate
 exit-address-family
exit
!
line vty
!
