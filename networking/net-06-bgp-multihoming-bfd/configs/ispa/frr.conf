! ispa - ISP-A, AS 64501. Upstream: inet (AS 64500, "the Internet"). Customer: ent (AS 65010).
!
! Behaves like a real (if slightly sloppy) ISP edge:
!   * customer routes are filtered to what the customer owns and get local-pref 200 (customer > peer);
!   * the customer gets a default route plus everything ISP-A knows - INCLUDING junk ISP-A should never
!     send: an RFC 1918 block, a CGNAT block and a more-specific /25. Those exist only to prove that the
!     customer's inbound filter works (the lab asserts ISP-A sent them and ent dropped them);
!   * only the customer's prefix is announced upstream.
! The junk prefixes point to blackhole routes on ISP-A; 198.51.100.128/25 only covers the upper half of
! the server LAN, so it never affects the probe target 198.51.100.10.
frr version 10.6
frr defaults traditional
hostname ispa
log file /tmp/frr.log informational
service integrated-vtysh-config
!
ip forwarding
!
debug bgp neighbor-events
debug bfd peer
!
interface eth1
 description customer ent (through the access circuit / NID)
 ip address 10.0.1.1/30
exit
!
interface eth2
 description upstream inet
 ip address 10.1.1.1/30
exit
!
ip route 10.66.0.0/16 blackhole
ip route 100.64.0.0/10 blackhole
ip route 198.51.100.128/25 blackhole
!
bfd
 profile fast
  detect-multiplier 3
  receive-interval 100
  transmit-interval 100
 exit
exit
!
ip prefix-list CUSTOMER-ENT seq 10 permit 203.0.113.0/24
!
route-map CUSTOMER-IN permit 10
 match ip address prefix-list CUSTOMER-ENT
 set local-preference 200
exit
route-map TO-CUSTOMER permit 10
exit
route-map FROM-UPSTREAM permit 10
exit
route-map TO-UPSTREAM permit 10
 match ip address prefix-list CUSTOMER-ENT
exit
!
router bgp 64501
 bgp router-id 10.255.1.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.0.1.2 remote-as 65010
 neighbor 10.0.1.2 description customer ent
 neighbor 10.0.1.2 timers 10 30
 neighbor 10.0.1.2 timers connect 5
 neighbor 10.0.1.2 advertisement-interval 0
 neighbor 10.0.1.2 bfd
 neighbor 10.0.1.2 bfd profile fast
 neighbor 10.1.1.2 remote-as 64500
 neighbor 10.1.1.2 description upstream inet
 neighbor 10.1.1.2 timers connect 5
 neighbor 10.1.1.2 advertisement-interval 0
 !
 address-family ipv4 unicast
  network 10.66.0.0/16
  network 100.64.0.0/10
  network 198.51.100.128/25
  neighbor 10.0.1.2 activate
  neighbor 10.0.1.2 default-originate
  neighbor 10.0.1.2 route-map CUSTOMER-IN in
  neighbor 10.0.1.2 route-map TO-CUSTOMER out
  neighbor 10.1.1.2 activate
  neighbor 10.1.1.2 route-map FROM-UPSTREAM in
  neighbor 10.1.1.2 route-map TO-UPSTREAM out
 exit-address-family
exit
!
line vty
!
