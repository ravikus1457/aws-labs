! ent - enterprise edge router, AS 65010, dual-homed to ISP-A (AS 64501) and ISP-B (AS 64502).
!
! Policy, in one place:
!   outbound  : only our own prefix 203.0.113.0/24 leaves, to either ISP (no transit, no infra leaks);
!               towards ISP-B it is prepended twice so the Internet prefers ISP-A for INBOUND traffic.
!   inbound   : bogons, our own space and anything longer than /24 are dropped; the default and
!               normal prefixes are accepted. ISP-A gets local-preference 200, ISP-B 100, so OUTBOUND
!               traffic prefers ISP-A and ISP-B is the hot standby.
!   detection : BFD 100 ms x 3 on both eBGP sessions (300 ms), BGP keepalive/hold 10/30 s as the
!               fallback, connect-retry 5 s so a restored link comes back quickly.
!   inside    : OSPF area 0 carries only loopbacks + the ent-core link; iBGP to core (loopback to
!               loopback, next-hop-self) carries the Internet routes in and our prefix out.
frr version 10.6
frr defaults traditional
hostname ent
log file /tmp/frr.log informational
service integrated-vtysh-config
!
ip forwarding
!
debug bgp neighbor-events
debug bfd peer
!
interface lo
 ip address 10.255.0.1/32
exit
!
interface eth1
 description ISP-A (through the ISP-A access circuit / NID)
 ip address 10.0.1.2/30
exit
!
interface eth2
 description ISP-B
 ip address 10.0.2.2/30
exit
!
interface eth3
 description core (internal)
 ip address 10.0.0.1/30
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
router ospf
 ospf router-id 10.255.0.1
 network 10.0.0.0/30 area 0
 network 10.255.0.1/32 area 0
exit
!
bfd
 profile fast
  detect-multiplier 3
  receive-interval 100
  transmit-interval 100
 exit
exit
!
! --- prefix lists --------------------------------------------------------------------------
ip prefix-list OWN-PREFIXES seq 10 permit 203.0.113.0/24
!
! Martians/bogons (RFC 6890 et al.) plus our own space. 0.0.0.0/8 le 32 does NOT match the
! default route (a /0 is shorter than /8), so the default survives this list.
ip prefix-list BOGONS seq 5 permit 0.0.0.0/8 le 32
ip prefix-list BOGONS seq 10 permit 10.0.0.0/8 le 32
ip prefix-list BOGONS seq 15 permit 100.64.0.0/10 le 32
ip prefix-list BOGONS seq 20 permit 127.0.0.0/8 le 32
ip prefix-list BOGONS seq 25 permit 169.254.0.0/16 le 32
ip prefix-list BOGONS seq 30 permit 172.16.0.0/12 le 32
ip prefix-list BOGONS seq 35 permit 192.168.0.0/16 le 32
ip prefix-list BOGONS seq 40 permit 224.0.0.0/3 le 32
ip prefix-list BOGONS seq 45 permit 203.0.113.0/24 le 32
!
! Anything more specific than /24 is not globally routable; drop it.
ip prefix-list TOO-SPECIFIC seq 5 permit 0.0.0.0/0 ge 25
!
! --- route maps ----------------------------------------------------------------------------
route-map ISPA-IN deny 10
 match ip address prefix-list BOGONS
exit
route-map ISPA-IN deny 20
 match ip address prefix-list TOO-SPECIFIC
exit
route-map ISPA-IN permit 100
 set local-preference 200
exit
!
route-map ISPB-IN deny 10
 match ip address prefix-list BOGONS
exit
route-map ISPB-IN deny 20
 match ip address prefix-list TOO-SPECIFIC
exit
route-map ISPB-IN permit 100
 set local-preference 100
exit
!
route-map ISPA-OUT permit 10
 match ip address prefix-list OWN-PREFIXES
exit
!
route-map ISPB-OUT permit 10
 match ip address prefix-list OWN-PREFIXES
 set as-path prepend 65010 65010
exit
!
! --- BGP -----------------------------------------------------------------------------------
router bgp 65010
 bgp router-id 10.255.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.0.1.1 remote-as 64501
 neighbor 10.0.1.1 description ISP-A
 neighbor 10.0.1.1 timers 10 30
 neighbor 10.0.1.1 timers connect 5
 neighbor 10.0.1.1 advertisement-interval 0
 neighbor 10.0.1.1 bfd
 neighbor 10.0.1.1 bfd profile fast
 neighbor 10.0.2.1 remote-as 64502
 neighbor 10.0.2.1 description ISP-B
 neighbor 10.0.2.1 timers 10 30
 neighbor 10.0.2.1 timers connect 5
 neighbor 10.0.2.1 advertisement-interval 0
 neighbor 10.0.2.1 bfd
 neighbor 10.0.2.1 bfd profile fast
 neighbor 10.255.0.2 remote-as 65010
 neighbor 10.255.0.2 description core (iBGP)
 neighbor 10.255.0.2 update-source lo
 !
 address-family ipv4 unicast
  neighbor 10.0.1.1 activate
  neighbor 10.0.1.1 soft-reconfiguration inbound
  neighbor 10.0.1.1 route-map ISPA-IN in
  neighbor 10.0.1.1 route-map ISPA-OUT out
  neighbor 10.0.2.1 activate
  neighbor 10.0.2.1 soft-reconfiguration inbound
  neighbor 10.0.2.1 route-map ISPB-IN in
  neighbor 10.0.2.1 route-map ISPB-OUT out
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 next-hop-self
 exit-address-family
exit
!
line vty
!
